name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Resolve release version
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          if [[ "$RELEASE_TAG" != v* ]]; then
            echo "Release tag must start with v" >&2
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.asset }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            asset: hybrid-search_Linux_x86_64.tar.gz
            cross: false
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            asset: hybrid-search_Linux_aarch64.tar.gz
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            asset: hybrid-search_Darwin_x86_64.tar.gz
            cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            asset: hybrid-search_Darwin_aarch64.tar.gz
            cross: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            asset: hybrid-search_Windows_x86_64.zip
            cross: false
            windows: true
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            asset: hybrid-search_Windows_aarch64.zip
            cross: false
            windows: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26.7.0"
          package-manager-cache: false

      - name: Set up Rust 1.97.1
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.target }}

      - name: Set version from tag
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          node <<'NODE'
          const fs = require("fs");
          const manifestPath = "Cargo.toml";
          const manifest = fs.readFileSync(manifestPath, "utf8");
          const versionPattern = /^version\s*=\s*"[^"]+"/m;
          if (!versionPattern.test(manifest)) {
            throw new Error("Cargo package version was not found");
          }
          const updated = manifest.replace(
            versionPattern,
            `version = "${process.env.VERSION}"`
          );
          fs.writeFileSync(manifestPath, updated);
          NODE
          cargo update -p hybridsearch-mcp

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@cross

      - name: Build with cross
        if: matrix.cross == true
        run: cross build --release --locked --target ${{ matrix.target }}

      - name: Build with Cargo
        if: matrix.cross != true
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package Unix binary
        if: matrix.windows != true
        shell: bash
        run: |
          mkdir package
          cp target/${{ matrix.target }}/release/hybrid-search package/
          cp README.md README.zh-CN.md LICENSE THIRD_PARTY_NOTICES.md package/
          tar -C package -czf ${{ matrix.asset }} .

      - name: Package Windows binary
        if: matrix.windows == true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package
          Copy-Item target/${{ matrix.target }}/release/hybrid-search.exe package/
          Copy-Item README.md,README.zh-CN.md,LICENSE,THIRD_PARTY_NOTICES.md package/
          Compress-Archive -Path package/* -DestinationPath ${{ matrix.asset }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        working-directory: artifacts
        run: sha256sum *.tar.gz *.zip > SHA256SUMS

      - name: Create GitHub Release
        working-directory: artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" ./* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" ./* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
          fi

  publish-npm-platforms:
    name: Publish ${{ matrix.platform }} package to npm
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - platform: linux-x64
            asset: hybrid-search_Linux_x86_64.tar.gz
            binary: hybrid-search
          - platform: linux-arm64
            asset: hybrid-search_Linux_aarch64.tar.gz
            binary: hybrid-search
          - platform: darwin-x64
            asset: hybrid-search_Darwin_x86_64.tar.gz
            binary: hybrid-search
          - platform: darwin-arm64
            asset: hybrid-search_Darwin_aarch64.tar.gz
            binary: hybrid-search
          - platform: win32-x64
            asset: hybrid-search_Windows_x86_64.zip
            binary: hybrid-search.exe
          - platform: win32-arm64
            asset: hybrid-search_Windows_aarch64.zip
            binary: hybrid-search.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || needs.prepare.outputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26.7.0"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Download release binary
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.asset }}
          path: dist

      - name: Prepare platform package
        shell: bash
        run: |
          PACKAGE_DIR="npm/platforms/${{ matrix.platform }}"
          EXTRACT_DIR="$(mktemp -d)"
          mkdir -p "$PACKAGE_DIR/bin"
          if [[ "${{ matrix.asset }}" == *.zip ]]; then
            unzip "dist/${{ matrix.asset }}" -d "$EXTRACT_DIR"
          else
            tar -xzf "dist/${{ matrix.asset }}" -C "$EXTRACT_DIR"
          fi
          cp "$EXTRACT_DIR/${{ matrix.binary }}" "$PACKAGE_DIR/bin/"
          if [[ "${{ matrix.binary }}" != *.exe ]]; then
            chmod 0755 "$PACKAGE_DIR/bin/${{ matrix.binary }}"
          fi
          cp LICENSE THIRD_PARTY_NOTICES.md "$PACKAGE_DIR/"
          npm --prefix "$PACKAGE_DIR" version "$VERSION" --no-git-tag-version --allow-same-version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}

      - name: Publish platform package
        working-directory: npm/platforms/${{ matrix.platform }}
        run: npm publish --access public

  publish-npm:
    name: Publish main package to npm
    needs: [prepare, publish-npm-platforms]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || needs.prepare.outputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26.7.0"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Sync package versions with tag
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          PACKAGE_DIR="npm/hybridsearch-mcp"
          npm --prefix "$PACKAGE_DIR" version "$VERSION" --no-git-tag-version --allow-same-version
          cp LICENSE THIRD_PARTY_NOTICES.md "$PACKAGE_DIR/"
          node <<'NODE'
          const fs = require("fs");
          const manifestPath = "npm/hybridsearch-mcp/package.json";
          const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
          for (const name of Object.keys(manifest.optionalDependencies)) {
            manifest.optionalDependencies[name] = process.env.VERSION;
          }
          fs.writeFileSync(manifestPath, `${JSON.stringify(manifest, null, 2)}\n`);
          NODE

      - name: Publish main package
        working-directory: npm/hybridsearch-mcp
        run: npm publish --access public
