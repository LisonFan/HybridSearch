name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            asset: hybrid-search_Linux_x86_64.tar.gz
            cross: false
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            asset: hybrid-search_Linux_aarch64.tar.gz
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            asset: hybrid-search_Darwin_x86_64.tar.gz
            cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            asset: hybrid-search_Darwin_aarch64.tar.gz
            cross: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            asset: hybrid-search_Windows_x86_64.zip
            cross: false
            windows: true
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            asset: hybrid-search_Windows_aarch64.zip
            cross: false
            windows: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "26.7.0"
          package-manager-cache: false

      - name: Set up Rust 1.97.1
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.target }}

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION="$VERSION" node <<'NODE'
          const fs = require("fs");
          const manifestPath = "Cargo.toml";
          const manifest = fs.readFileSync(manifestPath, "utf8");
          const updated = manifest.replace(
            /^version\s*=\s*"[^"]+"/m,
            `version = "${process.env.VERSION}"`
          );
          if (updated === manifest) throw new Error("Cargo package version was not found");
          fs.writeFileSync(manifestPath, updated);
          NODE
          cargo update -p hybridsearch-mcp

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@cross

      - name: Build with cross
        if: matrix.cross == true
        run: cross build --release --locked --target ${{ matrix.target }}

      - name: Build with Cargo
        if: matrix.cross != true
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package Unix binary
        if: matrix.windows != true
        shell: bash
        run: |
          mkdir package
          cp target/${{ matrix.target }}/release/hybrid-search package/
          cp README.md README.zh-CN.md LICENSE THIRD_PARTY_NOTICES.md package/
          tar -C package -czf ${{ matrix.asset }} .

      - name: Package Windows binary
        if: matrix.windows == true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package
          Copy-Item target/${{ matrix.target }}/release/hybrid-search.exe package/
          Copy-Item README.md,README.zh-CN.md,LICENSE,THIRD_PARTY_NOTICES.md package/
          Compress-Archive -Path package/* -DestinationPath ${{ matrix.asset }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        working-directory: artifacts
        run: sha256sum *.tar.gz *.zip > SHA256SUMS

      - name: Create GitHub Release
        working-directory: artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" ./* --repo "${GITHUB_REPOSITORY}" --verify-tag --generate-notes

  publish-npm-platforms:
    name: Publish ${{ matrix.platform }} package to npm
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - platform: linux-x64
            asset: hybrid-search_Linux_x86_64.tar.gz
            binary: hybrid-search
          - platform: linux-arm64
            asset: hybrid-search_Linux_aarch64.tar.gz
            binary: hybrid-search
          - platform: darwin-x64
            asset: hybrid-search_Darwin_x86_64.tar.gz
            binary: hybrid-search
          - platform: darwin-arm64
            asset: hybrid-search_Darwin_aarch64.tar.gz
            binary: hybrid-search
          - platform: win32-x64
            asset: hybrid-search_Windows_x86_64.zip
            binary: hybrid-search.exe
          - platform: win32-arm64
            asset: hybrid-search_Windows_aarch64.zip
            binary: hybrid-search.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "26.7.0"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Download release binary
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist

      - name: Prepare platform package
        shell: bash
        run: |
          PACKAGE_DIR="npm/platforms/${{ matrix.platform }}"
          mkdir -p "$PACKAGE_DIR/bin"
          if [[ "${{ matrix.asset }}" == *.zip ]]; then
            unzip "dist/${{ matrix.asset }}" -d "$PACKAGE_DIR/bin"
          else
            tar -xzf "dist/${{ matrix.asset }}" -C "$PACKAGE_DIR/bin"
          fi
          if [[ "${{ matrix.binary }}" != *.exe ]]; then
            chmod 0755 "$PACKAGE_DIR/bin/${{ matrix.binary }}"
          fi
          cp LICENSE THIRD_PARTY_NOTICES.md "$PACKAGE_DIR/"
          VERSION="${GITHUB_REF_NAME#v}"
          npm --prefix "$PACKAGE_DIR" version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Publish platform package
        working-directory: npm/platforms/${{ matrix.platform }}
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-npm:
    name: Publish main package to npm
    needs: publish-npm-platforms
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "26.7.0"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Sync package versions with tag
        shell: bash
        run: |
          PACKAGE_DIR="npm/hybridsearch-mcp"
          VERSION="${GITHUB_REF_NAME#v}"
          npm --prefix "$PACKAGE_DIR" version "$VERSION" --no-git-tag-version --allow-same-version
          cp LICENSE THIRD_PARTY_NOTICES.md "$PACKAGE_DIR/"
          VERSION="$VERSION" node <<'NODE'
          const fs = require("fs");
          const manifestPath = "npm/hybridsearch-mcp/package.json";
          const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
          for (const name of Object.keys(manifest.optionalDependencies)) {
            manifest.optionalDependencies[name] = process.env.VERSION;
          }
          fs.writeFileSync(manifestPath, `${JSON.stringify(manifest, null, 2)}\n`);
          NODE

      - name: Publish main package
        working-directory: npm/hybridsearch-mcp
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
