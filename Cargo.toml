[package]
name = "hybridsearch-mcp"
version = "0.0.5"
edition = "2024"
rust-version = "1.98.0"
description = "A Rust MCP server that combines ChatGPT2API, Tavily, Firecrawl, TinyFish, Exa, and Keenable web search"
license = "MIT"
readme = "README.md"
repository = "https://github.com/LisonFan/HybridSearch"
homepage = "https://github.com/LisonFan/HybridSearch"
keywords = ["mcp", "search", "tavily", "firecrawl", "exa"]
categories = ["command-line-utilities", "web-programming"]

[lib]
name = "hybridsearch_mcp"
path = "src/lib.rs"

[[bin]]
name = "hybrid-search"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures = "0.3"
percent-encoding = "2"
quick-xml = { version = "0.37", default-features = false, features = ["encoding"] }
reqwest = { version = "0.13", default-features = false, features = ["gzip", "json", "query", "rustls"] }
rmcp = { version = "3.0.0", features = ["macros", "server", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-std", "macros", "rt", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"
